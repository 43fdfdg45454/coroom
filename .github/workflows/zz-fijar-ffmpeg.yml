name: Fijar FFmpeg (temporal)

# Temporal: calcula en un runner (con acceso a github.com) los valores de tools/ffmpeg.lock.
on:
  push:
    branches: ["ccr-4342e305-smdi5r"]

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Releases y valores del lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=100" > releases.json
          python3 -c "import json; [print('TAG', r['tag_name'], r['created_at']) for r in json.load(open('releases.json'))]"
          tools/fetch-ffmpeg.sh --pin
          echo '--- LOCK ULTIMO'
          grep -E '^[A-Z_0-9]+=' tools/ffmpeg.lock
          prev=$(python3 - <<'PY'
          import json, datetime
          tags = [r['tag_name'] for r in json.load(open('releases.json')) if r['tag_name'].startswith('autobuild-')]
          now = datetime.datetime.utcnow().strftime('autobuild-%Y-%m')
          old = [t for t in tags if not t.startswith(now)]
          print(old[0] if old else '')
          PY
          )
          if [ -n "$prev" ]; then
            tools/fetch-ffmpeg.sh --pin "$prev"
            echo '--- LOCK MES ANTERIOR'
            grep -E '^[A-Z_0-9]+=' tools/ffmpeg.lock
          fi
