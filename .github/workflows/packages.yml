name: Paquetes

# Construye todo lo que se adjunta a una publicación, con la versión que calcula ci.yml: el
# Flatpak (flatpak.yml), el MSIX firmado con el certificado de prueba y el .zip portátil de Windows,
# la imagen de coroom-server por arquitectura (en GHCR solo por digest, sin etiqueta; «Publicación»
# las une y las etiqueta) y el driver de mando virtual firmado con su certificado de un solo uso
# (driver.yml). Lo llama ci.yml en cada push a main; a mano, desde la pestaña Actions.
on:
  workflow_call:
    inputs:
      version:
        description: Versión X.Y.Z
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Versión X.Y.Z
        required: true
        type: string
        # La base de `Cargo.toml`: con 0.0.0, cargo no resuelve el workspace (las crates se piden
        # entre sí con `^1.0.0`).
        default: 1.0.0

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ inputs.version }}

  driver:
    name: Driver de mando virtual
    uses: ./.github/workflows/driver.yml
    with:
      version: ${{ inputs.version }}

  windows:
    name: Windows (MSIX y zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Versión de Rust (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}

      # aws-lc-sys compila ensamblador con NASM en Windows y el runner no lo trae.
      - uses: ilammy/setup-nasm@v1

      # FFmpeg LGPL de tools/ffmpeg.lock (sus DLL van en el paquete) y libclang para `bindgen`.
      - name: FFmpeg
        run: |
          ./tools/fetch-ffmpeg.ps1
          if (-not $env:LIBCLANG_PATH) {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # Firma con un certificado de prueba creado en el runner (CN=coroom-dev, el del manifiesto):
      # para instalarlo hay que confiar antes en coroom-dev.cer (README, «Windows»). La firma real
      # se hace aparte con build.ps1 -CertificatePath.
      - name: MSIX y zip
        run: ./packaging/msix/build.ps1 -TestCertificate

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/coroom-${{ inputs.version }}-x64.msix
            dist/coroom-${{ inputs.version }}-windows-x64.zip
            dist/coroom-dev.cer
          if-no-files-found: error

  # Una arquitectura por runner, las dos nativas: cada una tiene el runner entero y arm64 no se
  # compila de forma cruzada. Cada imagen se sube a GHCR solo por digest, sin etiqueta (nadie la
  # ve como versión ni la baja con `:latest`); «Publicación» las une en una imagen
  # multiarquitectura y le pone las etiquetas cuando las comprobaciones han pasado, sin volver a
  # compilar.
  docker:
    name: Imagen del servidor (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}

      - name: Nombre de la imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coroom-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=coroom-server
            org.opencontainers.image.description=Servidor autoalojado de coroom: API, señalización y relay
            org.opencontainers.image.version=${{ inputs.version }}

      # Registro de crates y target/ de las cachés de BuildKit del Dockerfile (las capas no hacen
      # falta: lo que cuesta es cargo). Una entrada por commit y, al empezar, la más reciente; cargo
      # recompila solo lo que cambió. Se declara antes que buildkit-cache-dance para que, al
      # terminar, la caché se guarde después de sacar los datos de BuildKit.
      - name: Caché de cargo
        id: cache
        uses: actions/cache@v4
        with:
          path: cargo-cache
          key: docker-cargo-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: docker-cargo-${{ matrix.arch }}-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cargo-cache/registry": {"target": "/usr/local/cargo/registry", "id": "coroom-registry-${{ matrix.arch }}"},
              "cargo-cache/target": {"target": "/src/target", "id": "coroom-target-${{ matrix.arch }}"}
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.image.outputs.name }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
          cat "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
