name: Android

# El invitado Android: `libcoroom_android.so` (apps/android) con el NDK del runner para arm64-v8a
# y x86_64, y el APK de packaging/android con Gradle. Lo llama packages.yml; a mano, desde la
# pestaña Actions.
#
# Firma: con los secretos COROOM_ANDROID_KEYSTORE (el almacén PKCS12 en base64),
# COROOM_ANDROID_KEYSTORE_PASSWORD, COROOM_ANDROID_KEY_ALIAS y COROOM_ANDROID_KEY_PASSWORD, la clave
# de la publicación; sin ellos, la de depuración del runner (el APK instala, pero no se actualiza
# encima de uno firmado con otra clave).
on:
  workflow_call:
    inputs:
      version:
        description: Versión X.Y.Z
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Versión X.Y.Z
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Versión de Rust (rust-toolchain.toml)
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: ./.github/actions/version
        with:
          version: ${{ env.VERSION }}

      - name: cargo-ndk
        run: cargo install cargo-ndk@4.1.2 --locked

      # El runner trae el SDK y el NDK más reciente (ANDROID_NDK_LATEST_HOME); cmake para libopus.
      - name: NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cmake --version | head -1

      # API 28 (Android 9): la que piden las capas de MediaCodec y AAudio. El procesado de voz es
      # C++: --link-libcxx-shared copia libc++_shared.so del NDK junto a la nuestra.
      - name: libcoroom_android.so
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -P 28 --link-libcxx-shared \
            -o packaging/android/app/src/main/jniLibs \
            build --release --locked -p coroom-android
          find packaging/android/app/src/main/jniLibs -name '*.so' -exec ls -l {} +

      # Cada biblioteca que pide la nuestra tiene que estar en el teléfono (las del sistema que da
      # el NDK) o en el APK; si no, la app no arranca (UnsatisfiedLinkError al cargarla).
      - name: Dependencias de libcoroom_android.so
        run: |
          system="libc.so libm.so libdl.so liblog.so libandroid.so libmediandk.so libaaudio.so"
          failed=0
          for dir in packaging/android/app/src/main/jniLibs/*/; do
            for needed in $(readelf -d "${dir}libcoroom_android.so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
              case " $system " in *" $needed "*) continue ;; esac
              if [ ! -f "$dir$needed" ]; then
                echo "::error::${dir}libcoroom_android.so pide $needed y no va en el APK"
                failed=1
              fi
            done
          done
          exit $failed

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Versión de Gradle (gradle-wrapper.properties)
        id: gradle
        run: echo "version=$(sed -n 's|^distributionUrl=.*gradle-\([0-9.]*\)-bin.zip$|\1|p' packaging/android/gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      # El almacén es PKCS12 (lo que crea keytool desde Java 9; un JKS también vale: Java abre los
      # dos con el tipo por defecto). En un PKCS12 la clave lleva la contraseña del almacén, así que
      # COROOM_ANDROID_KEY_PASSWORD es la misma. Si falta alguno de los cuatro secretos, Gradle firma
      # con la clave de depuración: se avisa aquí para que no pase sin verse.
      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.COROOM_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.COROOM_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COROOM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COROOM_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::COROOM_ANDROID_KEYSTORE está, pero falta COROOM_ANDROID_KEYSTORE_PASSWORD, COROOM_ANDROID_KEY_ALIAS o COROOM_ANDROID_KEY_PASSWORD"
              exit 1
            fi
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/coroom.p12"
            echo "COROOM_ANDROID_KEYSTORE=$RUNNER_TEMP/coroom.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::sin COROOM_ANDROID_KEYSTORE: el APK va firmado con la clave de depuración del runner"
          fi

      - name: APK
        working-directory: packaging/android
        env:
          COROOM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.COROOM_ANDROID_KEYSTORE_PASSWORD }}
          COROOM_ANDROID_KEY_ALIAS: ${{ secrets.COROOM_ANDROID_KEY_ALIAS }}
          COROOM_ANDROID_KEY_PASSWORD: ${{ secrets.COROOM_ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -Pcoroom.version="$VERSION" :app:lintRelease :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/coroom-$VERSION-android.apk"
          ls -l out

      # Con la clave de la publicación, el APK no puede ir con la de depuración: Android no
      # instalaría la versión siguiente encima. La huella queda en el resumen del job.
      - name: Firma del APK
        env:
          KEYSTORE: ${{ secrets.COROOM_ANDROID_KEYSTORE }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          certs="$("$build_tools/apksigner" verify --print-certs "packaging/android/out/coroom-$VERSION-android.apk")"
          echo "$certs"
          echo "Firma del APK: $(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$KEYSTORE" ] && echo "$certs" | grep -q 'certificate DN: .*CN=Android Debug'; then
            echo "::error::el APK salió firmado con la clave de depuración aunque COROOM_ANDROID_KEYSTORE está"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: packaging/android/out/*.apk
          if-no-files-found: error

      - name: Lint completo
        if: failure()
        run: cat packaging/android/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true

      - name: Informe de lint
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: packaging/android/app/build/reports/
          if-no-files-found: ignore
