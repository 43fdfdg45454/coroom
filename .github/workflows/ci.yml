name: CI

# Integración y entrega continuas:
#
# 1. «Versión»: GitVersion calcula X.Y.Z del historial (GitVersion.yml). En main, la última
#    etiqueta vX.Y.Z más un parche (o menor/mayor con «+semver: minor|major» en un commit).
# 2. «Comprobaciones» (Linux y Windows) y «Paquetes» (Flatpak, MSIX y zip, imagen del servidor,
#    driver, APK de Android; packages.yml) en paralelo, con esa versión escrita en el workspace.
# 3. «Publicación», solo en main y solo si todo lo anterior pasó: etiqueta la imagen en GHCR, crea la
#    etiqueta vX.Y.Z y la release de GitHub con los paquetes y las notas. Nadie crea etiquetas ni
#    toca la versión a mano.
# 4. «Repositorio Flatpak», detrás de la release: sube a GitHub Pages el repositorio Flatpak firmado
#    que dejó «Paquetes» (con la versión nueva encima de las publicadas), del que se actualizan
#    las instalaciones del Flatpak. Sin la clave COROOM_FLATPAK_GPG_KEY no hay nada que subir.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Las ejecuciones de main van en fila: cada una publica su versión y la siguiente parte de ella.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      semver: ${{ steps.gitversion.outputs.semVer }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion necesita el historial entero y las etiquetas

      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - run: echo "Versión ${{ steps.gitversion.outputs.semVer }} (publicar ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }})" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Comprobaciones (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Versión de Rust (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      # La clave cambió al añadir NASM en Linux: lo de OpenH264 guardado sin ensamblador no sirve.
      - uses: Swatinem/rust-cache@v2
        with:
          key: openh264-asm

      - uses: ./.github/actions/version
        with:
          version: ${{ needs.version.outputs.version }}

      # aws-lc-sys y OpenH264 compilan ensamblador con NASM y el runner de Windows no lo trae.
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # Captura por PipeWire (libpipewire + bindgen/libclang), ventana Wayland/X11, lavapipe para
      # los tests de render sin GPU, los cargadores de VA-API y oneVPL que abre FFmpeg (si la build
      # los trae estáticos, sobran), libudev para los mandos (`gilrs`), cmake (libopus de
      # `opusic-sys`), meson + ninja (el procesado de voz de `webrtc-audio-processing`) y NASM (el
      # ensamblador de OpenH264; sin él no enlaza, ver `coroom_codec::openh264`).
      - name: Dependencias de sistema
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config mesa-vulkan-drivers libxkbcommon-dev libwayland-dev libva2 libva-drm2 libvpl2 libudev-dev cmake meson ninja-build nasm

      # abseil-cpp para la compilación de `webrtc-audio-processing`: los ficheros y SHA-256 de su
      # wrap, en el directorio que lee meson (`MESON_PACKAGE_CACHE_DIR`, .cargo/config.toml).
      - name: Caché de meson
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: third_party/meson-packagecache
          key: meson-wraps-${{ hashFiles('tools/fetch-meson-wraps.sh') }}

      - name: Paquetes de meson
        if: runner.os == 'Linux'
        run: tools/fetch-meson-wraps.sh

      # FFmpeg 8 LGPL compartido de BtbN fijado en tools/ffmpeg.lock. La caché va por etiqueta del
      # release: solo se descarga otra vez al fijar uno nuevo.
      - name: Etiqueta de FFmpeg
        id: ffmpeg
        shell: bash
        run: echo "tag=$(sed -n 's/^BTBN_TAG=//p' tools/ffmpeg.lock | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Caché de FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg.outputs.tag }}

      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: tools/fetch-ffmpeg.sh

      # En Windows las DLL se buscan en el PATH (los tests corren desde target\debug\deps) y
      # `bindgen` (rusty_ffmpeg) necesita libclang, que el runner trae con LLVM.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch-ffmpeg.ps1
          "$env:GITHUB_WORKSPACE\third_party\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not $env:LIBCLANG_PATH) {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Formato
        run: cargo fmt --all --check

      # Los locks del workspace y de fuzz/ (que se compila con --locked más abajo) y las fuentes del
      # Flatpak, al día con las dependencias: falla aquí en segundos, no a mitad de la CI.
      - name: Locks al día
        if: runner.os == 'Linux'
        run: tools/check-locks.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148

      # Dos clases de pruebas (crates/testkit): las funcionales hacen fallar la CI; los umbrales de
      # tiempo (`timing_assert!`: latencias, ritmos, huecos) solo dejan un aviso en el informe, que
      # «Avisos de tiempo» publica al final. nextest corre los binarios en paralelo
      # (.config/nextest.toml); los ejemplos de la documentación van aparte con `cargo test --doc`.
      # Si falla, los tests que fallan salen también como anotaciones: se ven en la API pública de
      # las comprobaciones sin descargar el registro.
      - name: Tests
        shell: bash
        env:
          COROOM_TIMING_REPORT: ${{ runner.temp }}/timing.txt
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked --profile ci 2>&1 | tee test-output.txt || {
            grep -E "^ +(FAIL|TIMEOUT|ABORT|LEAK[A-Z-]*|SIG[A-Z]+) |panicked at" test-output.txt | tr -d '\r' | head -40 | sed 's/^ */::error::/'
            exit 1
          }
          cargo test --workspace --doc --locked

      # Firma híbrida Ed25519 + ML-DSA-65, tras su `feature` desactivada por defecto.
      - name: Firma híbrida (pq-sign)
        if: runner.os == 'Linux'
        run: cargo test -p coroom-crypto --features pq-sign --locked

      # Los objetivos de fuzzing compilan en stable; se ejecutan con nightly en fuzz.yml.
      - name: Fuzzing (compila)
        if: runner.os == 'Linux'
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --target-dir target --bins --locked
          cargo test -p coroom-server --features fuzzing --lib --locked fuzzing

      # Puertas de coste del E2EE (docs/ARQUITECTURA.md §2.3): SFrame, MLS y HPKE optimizados.
      - name: Puertas E2EE (release)
        if: runner.os == 'Linux'
        env:
          COROOM_TIMING_REPORT: ${{ runner.temp }}/timing.txt
        run: cargo test --release -p coroom-crypto --locked -- --ignored --nocapture

      # Medios con pérdida y jitter reales (tc netem en lo: 2 %, 10 ms ± 5 ms). Los tests `netem_*`
      # se saltan solos si no hay netem; aquí se aplica antes y se quita siempre después. Los dos
      # pasos netem son informativos (`continue-on-error`) hasta validar su comportamiento en los
      # runners: en el primer intento la matriz perdió la conexión de señalización al pasar al
      # perfil «media» (docs/ARQUITECTURA.md §7).
      - name: netem
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          COROOM_TIMING_REPORT: ${{ runner.temp }}/timing.txt
        run: |
          sudo modprobe sch_netem || true
          if ! sudo tools/netem.sh apply; then
            echo "::warning::el kernel del runner no tiene sch_netem; los tests netem_* no se ejecutan"
            exit 0
          fi
          status=0
          cargo test -p coroom-transport --locked -- netem --nocapture || status=$?
          # La sesión remota completa (servidor, anfitrión e invitado en proceso) con netem.
          cargo test -p coroom --test remote --locked -- netem --nocapture || status=$?
          sudo tools/netem.sh clear
          exit $status

      # Matriz de red: el test aplica cada perfil de tools/netem.sh (lan, buena, media, mala,
      # cuello) con `sudo -n` durante 30 s y lo quita al terminar; sin sch_netem se salta.
      - name: Matriz de red (netem)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          COROOM_TIMING_REPORT: ${{ runner.temp }}/timing.txt
        run: |
          sudo modprobe sch_netem || true
          cargo test -p coroom --test matrix --locked -- --ignored netem_matrix --nocapture

      # Los umbrales de tiempo que se salieron en cualquiera de los pasos anteriores, como avisos y
      # en el resumen del job. No falla nunca.
      - name: Avisos de tiempo
        if: always()
        shell: bash
        run: tools/timing-report.sh "$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/timing.txt"

      - name: cargo deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  packages:
    name: Paquetes
    needs: version
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write # la imagen del servidor, por digest y sin etiqueta
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit # las claves de firma del APK (android.yml) y del repositorio Flatpak (flatpak.yml), si están

  publish:
    name: Publicación ${{ needs.version.outputs.version }}
    needs: [version, check, packages]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # etiqueta y release
      packages: write # imagen en GHCR
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/version
        with:
          version: ${{ env.VERSION }}

      # La etiqueta vX.Y.Z la crea la release (abajo) sobre este commit. Si ya existe en otro
      # commit, es el resto de una publicación anterior que no terminó: se retira, junto con su
      # release si quedó vacía (sin paquetes). Una release con paquetes es una versión publicada y
      # esta ejecución no la sustituye.
      - name: Etiqueta v${{ env.VERSION }}
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          existing="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '"\(.id) \(.assets | length)"' 2>/dev/null || true)"
            if [ -n "$release" ]; then
              id="${release% *}"; assets="${release#* }"
              if [ "$assets" != 0 ]; then
                echo "::error::$tag ya está publicada sobre $existing con $assets paquetes; esta ejecución no la sustituye"
                exit 1
              fi
              echo "::warning::$tag tenía una release vacía sobre $existing; se retira"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            fi
            echo "::warning::$tag apuntaba a $existing; se mueve a $GITHUB_SHA"
            git push origin ":refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Solo lo que va a la release (el repositorio Flatpak, `flatpak-repo`, lo sube «pages»).
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{flatpak,windows,android,coroomvhid-*,digest-*}"

      - name: Paquetes
        run: |
          mkdir -p upload
          cp artifacts/flatpak/*.flatpak upload/
          cp artifacts/windows/* upload/
          cp artifacts/android/*.apk upload/
          for platform in x64 ARM64; do
            (cd "artifacts/coroomvhid-$platform" && zip -qr "../../upload/coroomvhid-$VERSION-$platform.zip" .)
          done
          (cd upload && sha256sum -- * > SHA256SUMS)
          ls -l upload

      # La imagen ya está en GHCR, una por arquitectura y solo por digest («Paquetes»): aquí se unen
      # en una imagen multiarquitectura con las etiquetas X.Y.Z y latest, sin volver a compilar.
      - name: Nombre de la imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coroom-server" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagen ${{ env.VERSION }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          refs=()
          for arch in amd64 arm64 arm; do
            refs+=("$IMAGE@$(cat "artifacts/digest-$arch/$arch")")
          done
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          platforms="$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION" \
            | jq -r '[.manifests[].platform | select(.os != "unknown")
                | "\(.os)/\(.architecture)\(if .architecture == "arm" then "/\(.variant // "")" else "" end)"]
                | sort | join(" ")')"
          if [ "$platforms" != "linux/amd64 linux/arm/v7 linux/arm64" ]; then
            echo "::error::la imagen $IMAGE:$VERSION tiene «$platforms» en vez de linux/amd64, linux/arm/v7 y linux/arm64"
            exit 1
          fi

      # Notas: los commits desde la etiqueta anterior (o desde el principio, en la primera). El
      # repositorio Flatpak solo se nombra si «Paquetes» lo firmó (con la clave del secreto). Los
      # pasos de una sola vez (instalar a mano, quitar el Flatpak de la rama `master`, desinstalar
      # el APK de la clave anterior) solo salen si la versión anterior es de antes de la
      # actualización automática (FIRST_AUTO_UPDATE, la primera que la trae).
      - name: Notas de la versión
        env:
          FLATPAK_REPO: ${{ needs.packages.outputs.flatpak-repo }}
          FIRST_AUTO_UPDATE: 2.1.0
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          range="${previous:+$previous..}HEAD"
          image="${{ steps.image.outputs.name }}:$VERSION"
          pages="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          app=io.github._43fdfdg45454.coroom
          migration=false
          if [ -n "$previous" ] && [ "${previous#v}" != "$FIRST_AUTO_UPDATE" ] &&
            [ "$(printf '%s\n' "${previous#v}" "$FIRST_AUTO_UPDATE" | sort -V | head -1)" = "${previous#v}" ]; then
            migration=true
          fi
          {
            echo "## coroom $VERSION"
            echo
            echo "### Actualización automática"
            echo
            if [ "$FLATPAK_REPO" = true ]; then
              echo "coroom se actualiza solo con el Flatpak, el \`.zip\` portátil de Windows y el APK de Android: avisa en Inicio, baja la versión nueva y se reinicia con ella. El MSIX sigue solo con el aviso. En el Flatpak, la actualización llega cuando el repositorio queda publicado en GitHub Pages, unos minutos después de esta release."
            else
              echo "coroom se actualiza solo con el \`.zip\` portátil de Windows y el APK de Android: avisa en Inicio, baja la versión nueva y se reinicia con ella. El Flatpak de esta versión va sin firmar y el MSIX, solo con el aviso."
            fi
            echo
            if [ "$migration" = true ]; then
              echo "Las versiones de antes de la actualización automática no saben actualizarse: se instala una a mano, una sola vez, y desde ahí se actualiza sola."
              echo
              if [ "$FLATPAK_REPO" = true ]; then
                echo "- **Linux**: el \`.flatpak\` de esta versión, que ya trae el repositorio Flatpak firmado (<$pages>). Si tenías uno anterior, quítalo después con \`flatpak uninstall --user $app//master\`: las versiones viejas iban en la rama \`master\` y las nuevas van en \`stable\`."
              fi
              echo "- **Windows**: el \`.zip\` de esta versión, descomprimido en una carpeta en la que puedas escribir (no dentro de Archivos de programa)."
              echo "- **Android**: la clave de firma cambió y Android no deja instalar este APK encima del anterior. Desinstala una vez la app vieja (se borra la sesión guardada: hay que volver a entrar) e instala este."
              echo
            fi
            echo "### Paquetes"
            echo
            if [ "$FLATPAK_REPO" = true ]; then
              echo "- **Linux**: \`coroom-$VERSION-x86_64.flatpak\` (\`flatpak install --user coroom-$VERSION-x86_64.flatpak\`), con el repositorio configurado. También desde el repositorio: \`flatpak install --user ${pages}$app.flatpakref\`."
            else
              echo "- **Linux**: \`coroom-$VERSION-x86_64.flatpak\` (\`flatpak install --user coroom-$VERSION-x86_64.flatpak\`)."
            fi
            echo "- **Windows**: el portátil \`coroom-$VERSION-windows-x64.zip\`, que se actualiza solo, o \`coroom-$VERSION-x64.msix\` (firmado con el certificado de prueba \`coroom-dev.cer\`, que hay que instalar antes; avisa de las versiones nuevas, pero cada una se instala a mano)."
            echo "- **Android** (9 o posterior, invitado): \`coroom-$VERSION-android.apk\`, para instalar desde el archivo; se actualiza solo."
            echo "- **Servidor**: \`docker pull $image\`."
            echo "- **Driver de mando virtual** (Windows 10 22H2 u 11, x64 o ARM64): \`coroomvhid-$VERSION-x64.zip\` o \`coroomvhid-$VERSION-ARM64.zip\`. Driver UMDF2 en modo usuario, firmado en la CI con un certificado autofirmado de un solo uso (\`coroomvhid.cer\`, en el paquete; su clave privada se borró al terminar la compilación). Se instala con \`install.ps1\` en una consola de administrador, sin firma de prueba y con el arranque seguro y la integridad de memoria activados; \`uninstall.ps1\` lo quita todo, también el certificado. Los mandos convertidos llegan como Xbox 360 (XInput, hasta cuatro; después, HID genéricos) y los tal cual con el VID/PID y el descriptor del mando del invitado. Antes de publicarse se instala y se prueba en un Windows de la CI. Es opcional: sin él, coroom funciona y el mando puede ir como teclas."
            echo
            if [ -n "$previous" ]; then
              echo "### Cambios desde $previous"
            else
              echo "### Cambios"
            fi
            echo
            git log --no-merges --pretty='format:- %s (%h)' "$range"
            echo
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: coroom ${{ env.VERSION }}
          body_path: notes.md
          files: upload/*
          fail_on_unmatched_files: true

  # El repositorio Flatpak firmado (tools/flatpak-repo.sh, en «Paquetes») a GitHub Pages, con origen
  # «GitHub Actions» y sin rama: cada despliegue sustituye el sitio entero, y por eso el repositorio
  # ya trae lo publicado antes. Va detrás de la release para que las instalaciones no vean una
  # versión que no llegó a publicarse. Las ejecuciones de main van en fila (concurrency de arriba),
  # así que la siguiente copia lo que esta despliega.
  pages:
    name: Repositorio Flatpak (GitHub Pages)
    needs: [version, packages, publish]
    if: needs.version.outputs.publish == 'true' && needs.packages.outputs.flatpak-repo == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write # el despliegue
      id-token: write # deploy-pages se identifica con OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Una ejecución vieja relanzada a mano no devuelve Pages a una versión anterior: si lo
      # desplegado (el fichero `version` del sitio) es más nuevo, no se despliega.
      - name: Versión desplegada
        id: deployed
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/version"
          deployed="$(curl -fsSL "$url" 2>/dev/null | head -1 | tr -d '[:space:]' || true)"
          [[ "$deployed" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || deployed=
          echo "En Pages: ${deployed:-nada}; esta ejecución: $VERSION"
          if [ -n "$deployed" ] && [ "$deployed" != "$VERSION" ] &&
            [ "$(printf '%s\n' "$deployed" "$VERSION" | sort -V | tail -1)" = "$deployed" ]; then
            echo "::warning::GitHub Pages ya tiene la versión $deployed, más nueva que $VERSION: no se despliega"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.deployed.outputs.deploy == 'true'
        with:
          name: flatpak-repo
          path: site

      - uses: actions/upload-pages-artifact@v5
        if: steps.deployed.outputs.deploy == 'true'
        with:
          path: site

      # Un segundo intento si el primero falla (la API de Pages a veces no termina a tiempo).
      - id: deployment
        if: steps.deployed.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - id: deployment-retry
        if: steps.deployed.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
