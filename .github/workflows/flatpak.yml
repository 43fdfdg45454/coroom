name: Flatpak

# Construye el Flatpak de coroom (packaging/flatpak/) con flatpak-builder en el contenedor
# de flatpak-github-actions del runtime 26.08 y deja el .flatpak como artefacto. `packages.yml` lo
# llama con la versión calculada en cada push a main y «Publicación» adjunta el paquete a la
# release; en los pull requests que tocan el empaquetado se construye con la versión 1.0.0, la base
# de `Cargo.toml` (las crates se piden entre sí con `^1.0.0`: con 0.0.0 cargo no las resuelve).
on:
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "packaging/icons/**"
      - "tools/prune-cargo-target.py"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Versión X.Y.Z
        required: false
        type: string
        default: 1.0.0
  workflow_call:
    inputs:
      version:
        description: Versión X.Y.Z
        required: false
        type: string
        default: 1.0.0

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/version
        with:
          version: ${{ inputs.version || '1.0.0' }}

      # `Cargo.lock` y `cargo-sources.json` tienen que ir a la par: si alguien cambió las
      # dependencias sin regenerarlo (README, «Flatpak»), aquí se ve antes de construir.
      - name: Fuentes de cargo al día
        run: tools/check-locks.sh --flatpak-only

      # Estado de flatpak-builder (.flatpak-builder): descargas, módulos ya construidos y el
      # directorio de ccache, donde el manifiesto deja el `target/` de cargo. Una entrada por commit
      # y, al empezar, la más reciente: cargo y ccache saben qué hay que recompilar, así que no hace
      # falta que la clave cuadre. La caché propia de la acción no sirve para esto (con una clave
      # fija no se vuelve a guardar; con una que cambia no recupera la anterior): se apaga y solo
      # se le deja pasar `--ccache`.
      - name: Caché de flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-x86_64-${{ github.sha }}
          restore-keys: flatpak-builder-x86_64-

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github._43fdfdg45454.coroom.yml
          bundle: coroom-${{ inputs.version || '1.0.0' }}-x86_64.flatpak
          cache: true
          restore-cache: false
          save-cache: false
          upload-artifact: false

      # Tamaño de lo que se guarda (flatpak-builder ya poda sus módulos viejos al terminar).
      - name: Tamaño del estado de flatpak-builder
        run: du -sh .flatpak-builder/* .flatpak-builder

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: coroom-${{ inputs.version || '1.0.0' }}-x86_64.flatpak
          if-no-files-found: error
