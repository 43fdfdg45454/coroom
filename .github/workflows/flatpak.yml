name: Flatpak

# Construye el Flatpak de coroom (packaging/flatpak/) con flatpak-builder en el contenedor
# de flatpak-github-actions del runtime 26.08 y deja el .flatpak como artefacto. `packages.yml` lo
# llama con la versión calculada en cada push a main y «Publicación» adjunta el paquete a la
# release; en los pull requests que tocan el empaquetado se construye con la versión 0.0.0.
on:
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "packaging/icons/**"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Versión X.Y.Z
        required: false
        type: string
        default: 0.0.0
  workflow_call:
    inputs:
      version:
        description: Versión X.Y.Z
        required: false
        type: string
        default: 0.0.0

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/version
        with:
          version: ${{ inputs.version || '0.0.0' }}

      # `Cargo.lock` y `cargo-sources.json` tienen que ir a la par: si alguien cambió las
      # dependencias sin regenerarlo (README, «Flatpak»), aquí se ve antes de construir.
      - name: Fuentes de cargo al día
        run: |
          python3 - <<'EOF'
          import json, re, sys
          lock = open("Cargo.lock", encoding="utf-8").read()
          wanted = set()
          for block in lock.split("[[package]]")[1:]:
              if "source = \"registry+" not in block:
                  continue
              name = re.search(r'^name = "([^"]+)"', block, re.M).group(1)
              version = re.search(r'^version = "([^"]+)"', block, re.M).group(1)
              wanted.add(f"{name}-{version}")
          sources = json.load(open("packaging/flatpak/cargo-sources.json", encoding="utf-8"))
          have = {s["dest"].rsplit("/", 1)[-1] for s in sources if s.get("type") == "archive"}
          missing, extra = sorted(wanted - have), sorted(have - wanted)
          if missing or extra:
              print("cargo-sources.json no corresponde a Cargo.lock; regenera con flatpak-cargo-generator.py")
              print("faltan:", missing[:20], "sobran:", extra[:20])
              sys.exit(1)
          print(f"{len(have)} crates vendorizadas")
          EOF

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github._43fdfdg45454.coroom.yml
          bundle: coroom-${{ inputs.version || '0.0.0' }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**', 'Cargo.lock') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: coroom-${{ inputs.version || '0.0.0' }}-x86_64.flatpak
          if-no-files-found: error
