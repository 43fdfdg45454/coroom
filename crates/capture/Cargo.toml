[package]
name = "coroom-capture"
description = "Captura de pantalla de coroom tras el trait Capturer (WGC y PipeWire)."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Cada backend solo se compila en su sistema; activar los dos por defecto es inocuo en el otro.
default = ["pipewire", "wgc"]
pipewire = ["dep:pipewire", "dep:ashpd", "dep:tokio", "dep:tracing", "dep:rustix"]
# `windows` no es opcional en Windows: `FramePixels::D3D11` existe aunque falte `wgc`.
wgc = ["dep:tracing"]

[dependencies]
# `fit`: el tamaño máximo de la captura sintética con la misma regla que el codificador y la sesión.
coroom-proto.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true }
pipewire = { workspace = true, optional = true }
# Reloj monótono: datar el fotograma con la marca `pts` del compositor (`CLOCK_MONOTONIC`).
rustix = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
tracing = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
coroom-testkit.workspace = true
