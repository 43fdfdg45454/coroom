[package]
name = "coroom-codec"
description = "Codificación y decodificación de vídeo de coroom tras los traits Encoder y Decoder."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# FFmpeg (SVT-AV1, dav1d, Vulkan Video, NVENC/NVDEC, AMF, QSV, VAAPI). Sin ella solo queda OpenH264.
default = ["ffmpeg"]
ffmpeg = ["dep:rsmpeg", "dep:ash"]
# MediaCodec de Android: decodificación por hardware directa a la `Surface` de la vista del vídeo
# (`mediacodec`). En el equipo de desarrollo solo compila la parte independiente de la plataforma
# (elección de decodificadores, parámetros, contabilidad de búferes y esperas), con sus pruebas;
# la capa sobre el NDK solo existe con `target_os = "android"`.
mediacodec = ["dep:ndk"]

[dependencies]
ash = { workspace = true, optional = true }
# `fit`: el tope de resolución del codificador con la misma regla que la captura y la sesión.
coroom-proto.workspace = true
openh264.workspace = true
rsmpeg = { workspace = true, optional = true }
# Caché JSON de la calibración de codificadores (`calibrate`).
serde.workspace = true
serde_json.workspace = true
yuv.workspace = true

# `dlopen` de libva: comprobar que la libva del sistema tiene lo que FFmpeg 8.1 enlaza (≥ 2.21)
# antes de abrir VA-API, en vez de abortar en su *implib*.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# MediaCodec del NDK (`mediacodec`). Nivel de API 28 (Android 9), el mínimo con lo que usa la capa:
# `AMediaCodec_setAsyncNotifyCallback` (28), la única vía de la API segura de `ndk` 0.9 que da
# los índices de los búferes (sin ellos no se puede soltar un búfer de salida desde el hilo de la
# presentación), y `AImageReader_newWithUsage` (26) para la superficie de reserva sin pantalla.
# `low-latency` (`KEY_LOW_LATENCY`, Android 11) no exige subir el nivel: es una clave de texto
# del `MediaFormat` que solo se pone cuando el códec anuncia `FEATURE_LowLatency` (que tampoco
# existe antes de Android 11); en versiones anteriores la aplicación nunca lo anuncia.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { workspace = true, optional = true, features = [
    "media",
    "nativewindow",
    "api-level-28",
] }

# Texturas D3D11 de la captura y su importación en los *hw frames* de FFmpeg; la huella del
# sondeo (`ffmpeg::fingerprint`) enumera los adaptadores por DXGI y lee el registro.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
coroom-testkit.workspace = true
tempfile.workspace = true
