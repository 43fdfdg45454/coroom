[package]
name = "coroom-audio"
description = "Audio de coroom: captura, Opus, jitter, mezcla y supresión de ruido."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Cada backend solo se compila en su sistema; activarlos todos por defecto es inocuo en el otro.
default = ["pipewire", "wasapi", "bundled-opus", "webrtc-apm"]
# libopus incluida en la crate y compilada con CMake (sin ella, la del sistema).
bundled-opus = ["opusic-c/bundled", "opusic-sys/bundled"]
pipewire = ["dep:pipewire"]
wasapi = ["dep:wasapi", "dep:windows"]
# Procesado de voz de WebRTC (solo Linux: su compilación usa meson, ninja, `nm` y `objcopy`).
webrtc-apm = ["dep:webrtc-audio-processing"]
# AAudio en Android (el invitado), fuera de las de por defecto: la app de Android compila con
# `--no-default-features --features bundled-opus,aaudio` (libopus con CMake y el toolchain del NDK
# de `ANDROID_NDK_HOME`).
aaudio = ["dep:ndk", "dep:rustix"]

[dependencies]
tracing = { workspace = true }
bytemuck.workspace = true
opusic-c.workspace = true
opusic-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# DRED (redundancia profunda de Opus 1.5+) solo en Linux (en Windows, la FEC en banda).
opusic-c = { workspace = true, features = ["dred"] }
opusic-sys = { workspace = true, features = ["dred"] }
# `v0_3_49`: `pw_buffer.requested`, lo que el grafo pide en cada ciclo (el backend escribe justo
# eso; sin la feature la crate ni lo lee). La biblioteca tiene que ser más nueva de todos modos:
# `pw_stream_get_nsec` es de PipeWire 1.1 (ver `pipewire.rs`).
pipewire = { workspace = true, optional = true, features = ["v0_3_49"] }
zbus.workspace = true
libc.workspace = true
webrtc-audio-processing = { workspace = true, optional = true, features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { workspace = true, optional = true }
# Sesiones de audio por aplicación (IsSystemSoundsSession), el ejecutable de cada proceso y su
# padre (ToolHelp).
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
# AAudio de la API 28 (Android 9): uso, tipo de contenido y preset de entrada del flujo.
ndk = { workspace = true, optional = true, features = ["audio", "api-level-28"] }
# `CLOCK_MONOTONIC` para comparar con las marcas de AAudio y el *nice* de los hilos de audio.
rustix = { workspace = true, optional = true, features = ["process", "thread"] }

[lints]
workspace = true

[dev-dependencies]
coroom-testkit.workspace = true
