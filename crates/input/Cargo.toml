[package]
name = "coroom-input"
description = "Entrada de coroom: captura en el invitado e inyección en el anfitrión."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Cada backend solo se compila en su sistema; activar los dos por defecto es inocuo en el otro.
default = ["linux-portal", "windows-sendinput", "windows-vhid"]
# Linux: teclado y ratón por libei (portal `RemoteDesktop`) y mandos por uinput.
linux-portal = ["dep:reis", "dep:evdev", "dep:ashpd", "dep:tokio", "dep:rustix"]
# Windows: teclado y ratón por `SendInput`.
windows-sendinput = []
# Windows: mandos virtuales por el driver propio `coroomvhid` (UMDF2, drivers/windows-vhid). El
# formato de sus informes se compila (y se prueba) en todas las plataformas.
windows-vhid = ["windows-sendinput"]

[dependencies]
coroom-crypto.workspace = true
coroom-proto.workspace = true
crossbeam-channel.workspace = true
gilrs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true }
evdev = { workspace = true, optional = true }
reis = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# tests/windows_driver.rs: el driver instalado visto por XInput (job de prueba de driver.yml).
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = ["Win32_UI_Input_XboxController"] }

[lints]
workspace = true

[dev-dependencies]
coroom-testkit.workspace = true
