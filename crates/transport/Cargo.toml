[package]
name = "coroom-transport"
description = "Transporte QUIC de coroom: datagramas, FEC, NACK, control de tasa, NAT y cliente relay."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Proxy UDP con pérdida y retardo (`lossy::UdpLossy`) para los tests de esta crate y de las demás.
test-util = []

[dependencies]
bytes.workspace = true
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio-rustls.workspace = true
coroom-crypto.workspace = true
coroom-proto.workspace = true
getrandom.workspace = true
if-addrs.workspace = true
quinn.workspace = true
quinn-proto.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tracing.workspace = true
wtransport-proto.workspace = true

# RaptorQ 2.0.1 con `std` compila en ARM de 32 bits un camino NEON con intrínsecos que en Rust
# estable solo existen en aarch64 (`std::arch::arm` es inestable); sin `std` usa el camino genérico
# en todas las arquitecturas. La imagen arm/v7 del servidor (Raspberry Pi de 32 bits) va sin él.
[target.'cfg(not(target_arch = "arm"))'.dependencies]
raptorq = { workspace = true, features = ["std"] }

[target.'cfg(target_arch = "arm")'.dependencies]
raptorq.workspace = true

# `AT_HWCAP2`: si la CPU acelera AES-GCM, para elegir la suite TLS (tls.rs).
[target.'cfg(all(target_arch = "arm", target_os = "linux"))'.dependencies]
rustix = { workspace = true, features = ["param"] }

[target.'cfg(windows)'.dependencies]
# `timeBeginPeriod` y `SetProcessInformation`: resolución de 1 ms para el pacer de QUIC y los
# temporizadores, también con la ventana oculta o minimizada (ver quic.rs).
# `GetIpForwardTable2`: la puerta de enlace por defecto para abrir el puerto en el router (nat.rs).
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }

[dev-dependencies]
coroom-testkit.workspace = true
bytes.workspace = true
quinn.workspace = true
rustls.workspace = true
coroom-transport = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "test-util"] }

[lints]
workspace = true
