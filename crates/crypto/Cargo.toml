[package]
name = "coroom-crypto"
description = "Identidad, MLS, SFrame y HPKE de coroom."
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek.workspace = true
getrandom.workspace = true
sha2.workspace = true
openmls.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
sframe.workspace = true
aws-lc-rs.workspace = true
hpke.workspace = true
keyring.workspace = true
zeroize.workspace = true
hkdf.workspace = true
base64.workspace = true
ml-dsa = { workspace = true, optional = true }

[features]
default = ["pq"]
# KEM híbrido poscuántico X-Wing (X25519 + ML-KEM-768) para HPKE; sin ella, X25519 puro.
pq = ["hpke/mlkem"]
# Firma híbrida de la identidad (Ed25519 + ML-DSA-65, FIPS 204), en evaluación: la clave
# ML-DSA se deriva de la identidad (`Identity::pq_signing_key`). No la usa todavía ningún
# protocolo del cable; ver `docs/seguridad.md`.
pq-sign = ["dep:ml-dsa"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "e2ee"
harness = false
