[package]
name = "coroom-fuzz"
description = "Objetivos de fuzzing de coroom (cargo-fuzz con libFuzzer)."
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Workspace propio (el raíz lo excluye): `cargo fuzz` necesita nightly y sus propias banderas.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
coroom-proto = { path = "../crates/proto" }
coroom-crypto = { path = "../crates/crypto" }
coroom-transport = { path = "../crates/transport" }
# Sin FFmpeg ni backends de plataforma: solo la lógica que parsea.
coroom-codec = { path = "../crates/codec", default-features = false }
coroom-audio = { path = "../crates/audio", default-features = false, features = ["bundled-opus"] }
coroom-server = { path = "../apps/server", features = ["fuzzing"] }

# Las mismas opciones de desarrollo que el workspace raíz, para que `cargo check` aquí reutilice lo
# que ya compiló el raíz (`--target-dir ../target`).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3

[profile.dev.package.raptorq]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# `cargo fuzz` compila en release con aserciones de depuración; trazas legibles en los fallos.
[profile.release]
debug = "line-tables-only"

[lib]
path = "src/lib.rs"
test = false
doc = false

