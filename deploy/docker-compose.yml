services:
  server:
    image: ghcr.io/43fdfdg45454/coroom-server:${COROOM_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      COROOM_PUBLIC_HOST: ${COROOM_PUBLIC_HOST:?falta COROOM_PUBLIC_HOST en .env}
      COROOM_PUBLIC_UDP_PORT: ${COROOM_PUBLIC_UDP_PORT:-443}
      COROOM_PUBLIC_TCP_PORT: ${COROOM_PUBLIC_TCP_PORT:-443}
      COROOM_TLS_MODE: ${COROOM_TLS_MODE:-files}
      COROOM_TLS_CERT: ${COROOM_TLS_CERT:-/data/certs/fullchain.pem}
      COROOM_TLS_KEY: ${COROOM_TLS_KEY:-/data/certs/privkey.pem}
      COROOM_REGISTRATION: ${COROOM_REGISTRATION:-invite}
      COROOM_MAX_GUESTS_PER_ROOM: ${COROOM_MAX_GUESTS_PER_ROOM:-8}
      COROOM_RELAY_ENABLED: ${COROOM_RELAY_ENABLED:-true}
      COROOM_RELAY_ADDR: ${COROOM_RELAY_ADDR:?falta COROOM_RELAY_ADDR en .env}
      COROOM_RELAY_QUOTA_GB_PER_MONTH: ${COROOM_RELAY_QUOTA_GB_PER_MONTH:-0}
      COROOM_RELAY_MAX_KBPS: ${COROOM_RELAY_MAX_KBPS:-0}
      COROOM_SOURCE_URL: ${COROOM_SOURCE_URL:-https://github.com/43fdfdg45454/coroom}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${COROOM_PUBLIC_UDP_PORT:-443}:4433/udp"
      - "${COROOM_PUBLIC_TCP_PORT:-443}:8443/tcp"
    volumes:
      - ./data:/data
