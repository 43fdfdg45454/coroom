# coroom-server con Docker Compose. Uso: cp .env.sample .env && docker compose up -d
#
# La imagen sale de GHCR con la versión de COROOM_VERSION (.env; cada publicación vX.Y.Z sube
# ghcr.io/43fdfdg45454/coroom-server:X.Y.Z y :latest, amd64 y arm64). `docker compose up -d --build`
# la compila desde este repositorio en su lugar.
services:
  server:
    image: ${COROOM_IMAGE:-ghcr.io/43fdfdg45454/coroom-server}:${COROOM_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    restart: unless-stopped
    ports:
      # HTTP/3 (API, administración), señalización WebTransport y relay de medios.
      - "443:4433/udp"
      # HTTP/2 y HTTP/1.1 con TLS (respaldo con Alt-Svc) y reto ACME TLS-ALPN-01.
      - "443:8443/tcp"
      # Solo con COROOM_ACME_CHALLENGE=http-01 (y COROOM_BIND_HTTP=[::]:8080).
      # - "80:8080/tcp"
    volumes:
      # coroom.db (cuentas, invitaciones, amigos, uso del relay) y acme/ (cuenta y certificados).
      - data:/data
      # Modo COROOM_TLS_MODE=files: monta el certificado y la clave en solo lectura.
      # - ./certs:/certs:ro

volumes:
  data:
