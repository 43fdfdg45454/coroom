[package]
name = "coroom-server"
description = "Servidor autoalojado de coroom: HTTP/3, WebTransport y relay QUIC en un solo puerto UDP."
version.workspace = true
# Servicio de red: AGPL (ver LICENSE en este directorio); el resto del repositorio es Apache-2.0.
license = "AGPL-3.0-or-later"
edition.workspace = true
publish.workspace = true

[features]
# Arnés sin sockets para `fuzz/` (`coroom_server::fuzzing`); no entra en el binario normal.
fuzzing = []

[dependencies]
bytes.workspace = true
clap.workspace = true
coroom-transport.workspace = true
getrandom.workspace = true
h3.workspace = true
h3-quinn = { workspace = true, features = ["datagram"] }
h3-webtransport.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
argon2.workspace = true
subtle.workspace = true
tokio-rustls.workspace = true
rpassword.workspace = true
sha2.workspace = true

[dev-dependencies]
coroom-transport = { workspace = true, features = ["test-util"] }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "client", "http1"] }
tempfile.workspace = true

[lints]
workspace = true
