# Build de FFmpeg fijada para desarrollo y CI (ver README.md, «FFmpeg»).
#
# Origen: https://github.com/BtbN/FFmpeg-Builds/releases, variante LGPL compartida (sin x264, x265
# ni nada GPL), con hwcontext_vulkan, libsvtav1, libdav1d, libvpl, AMF, NVENC/NVDEC y VAAPI.
# `tools/fetch-ffmpeg.sh` y `tools/fetch-ffmpeg.ps1` descargan `<FICHERO>` del release `BTBN_TAG`,
# comprueban su SHA-256 y lo extraen en `third_party/ffmpeg/`.
#
# Formato: CLAVE=valor, una por línea (lo leen bash y PowerShell). Para fijar un release nuevo:
#
#   tools/fetch-ffmpeg.sh --pin                     # el autobuild más reciente
#   tools/fetch-ffmpeg.sh --pin autobuild-AAAA-MM-DD-HH-MM
#
# que rellena la etiqueta, los nombres de los dos ficheros y sus SHA-256 (de `checksums.sha256`
# del propio release o, si no lo trae, calculados tras descargarlos). Nunca `latest`: ese release
# se sustituye cada día y su SHA-256 cambia.
#
FFMPEG_VERSION=8.1
BTBN_TAG=autobuild-2026-10-11-13-04
LINUX_FILE=ffmpeg-n8.1.3-17-gc389840894-linux64-lgpl-shared-8.1.tar.xz
LINUX_SHA256=bf3db18a4a4bdc066f6b74ee5ec3d7b7be7d6738dcfd7162eae3e09cb857c6b2
WINDOWS_FILE=ffmpeg-n8.1.3-17-gc389840894-win64-lgpl-shared-8.1.zip
WINDOWS_SHA256=ba651b56d78b2a09a92d3699fd7751254e8b773dc2c3110081b7f9f4ff3b2c48
