# Flatpak de coroom. Se construye con:
#
#   flatpak-builder --user --install-deps-from=flathub --force-clean build-dir \
#       packaging/flatpak/io.github._43fdfdg45454.coroom.yml
#   flatpak build-bundle ~/.local/share/flatpak/repo coroom.flatpak io.github._43fdfdg45454.coroom
#
# (o con `.github/workflows/flatpak.yml`, que hace lo mismo en la CI y lo adjunta a cada release).
#
# Identificador: la convención de Flathub para proyectos de GitHub, `io.github.<usuario>.<repo>`,
# con `_` delante del usuario porque ningún componente puede empezar por un dígito.
#
# Runtime 26.08 (el más reciente de freedesktop-sdk). Ya trae, en la Platform, lo que coroom usa del
# sistema: FFmpeg 8.1.3, SVT-AV1 4.2, dav1d 1.5, libva 2.24, el cargador de Vulkan, PipeWire,
# Wayland, libopus 1.6.1 y WebRTC Audio Processing 2.1; libei no hace falta (`reis` habla el
# protocolo EI en Rust).
#
# - FFmpeg es el del runtime, sin compilar nada: coroom se enlaza con el del SDK (la misma etiqueta
#   n8.1.3 que `tools/ffmpeg.lock`, que fija un autobuild unos commits por delante) y, al
#   ejecutarse, la extensión
#   `org.freedesktop.Platform.codecs-extra` pone delante el suyo, con la misma configuración base
#   (Vulkan Video, VA-API, NVENC/NVDEC, AMF, SVT-AV1, dav1d) y todos los códecs: el de la Platform
#   sola no trae los codificadores de Vulkan ni el decodificador `hevc`. La extensión se instala
#   sola con el runtime (sin `no-autodownload`). Es GPL (x264 y x265); coroom la usa, no la
#   distribuye. Si alguien la bloquea (`flatpak mask`), queda el FFmpeg de la Platform y coroom elige
#   otro codificador (VA-API, NVENC o el software). El binario no lleva `rpath` a /usr/lib (ver
#   `emit_rpath` en `crates/codec/build/ffmpeg_dirs.rs`): uno ahí pasaba por delante de la
#   extensión y cargaba siempre el FFmpeg de la Platform (la 1.6.2 se cerraba al abrir).
# - coroom con cargo sin red: `cargo-sources.json` (generado con `flatpak-cargo-generator.py` de
#   flatpak-builder-tools desde `Cargo.lock`) vendoriza las crates de crates.io; las copias
#   parcheadas de `vendor/` vienen con el propio código. libopus (`opusic-sys`) y el procesado de
#   voz de WebRTC (`webrtc-audio-processing`, con meson) se compilan desde las crates; abseil-cpp
#   llega como paquete de meson (los mismos ficheros que `tools/fetch-meson-wraps.sh`).
# - Con `--ccache` (la CI), el `target/` de cargo vive en el directorio de ccache de
#   flatpak-builder (/run/ccache), que se guarda entre ejecuciones: solo se recompila lo que cambió.
#   `tools/prune-cargo-target.py` borra lo que esta compilación ya no usa para que no crezca.
id: io.github._43fdfdg45454.coroom
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  # Rust estable (1.98 en la rama 26.08) y libclang para `bindgen` (`rusty_ffmpeg`, `pipewire-sys`).
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: coroom
finish-args:
  # Ventana: Wayland nativo, X11 solo de respaldo; IPC compartida para X11 (MIT-SHM).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU: Vulkan, Vulkan Video, VA-API y NVENC/NVDEC.
  - --device=dri
  # Servidor de coroom, conexión directa entre pares (QUIC por UDP) y relay.
  - --share=network
  # Audio del juego, micrófono y salida por PipeWire nativo. La pantalla se captura por el portal
  # ScreenCast (sin permiso aquí: lo da el usuario en el diálogo del portal) y la entrada del
  # anfitrión por el portal RemoteDesktop (libei).
  - --filesystem=xdg-run/pipewire-0
  # Mandos: el invitado lee los suyos en /dev/input y, tal cual, en /dev/hidraw*; el anfitrión
  # crea mandos virtuales en /dev/uinput y los tal cual en /dev/uhid (cada nodo necesita además que
  # el usuario pueda abrirlo, ver el README). `--device=input` no cubre hidraw ni uhid, por eso
  # `all`. Ningún portal da todavía mandos virtuales ni HID en crudo; cuando exista, se quitará.
  - --device=all
  # El llavero va por el portal Secret (sin `--talk-name=org.freedesktop.secrets`): la identidad y
  # las credenciales se sellan con su clave en el directorio de datos del sandbox.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
modules:
  - name: coroom
    buildsystem: simple
    build-options:
      # Sin los CFLAGS/CXXFLAGS del SDK (-O2 …): la crate `cc` los añade al final de cada orden y
      # pisan el -O0 que aws-lc-sys exige para jitterentropy (`#error` si se compila con
      # optimizaciones). Cada crate pone sus propias banderas.
      cflags-override: true
      cxxflags-override: true
      env:
        CARGO_HOME: /run/build/coroom/cargo
        CARGO_NET_OFFLINE: 'true'
        # El FFmpeg del SDK (tienen prioridad sobre `.cargo/config.toml`).
        FFMPEG_INCLUDE_DIR: /usr/include
        FFMPEG_LIBS_DIR: /usr/lib/x86_64-linux-gnu
        FFMPEG_LINK_MODE: dynamic
        # Bindings de FFmpeg pregenerados (la misma n8.1.3 del runtime): con el libclang 22 del SDK,
        # bindgen deja opacas las estructuras y rsmpeg no compila (ver la cabecera del fichero).
        FFMPEG_BINDING_PATH: /run/build/coroom/packaging/flatpak/ffmpeg-binding.rs
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
        # abseil-cpp para meson, sin red (ver las fuentes `file` de abajo). El abseil del SDK está
        # compilado como C++20 y `webrtc-audio-processing` (C++17) no puede incluirlo: este
        # pkg-config lo oculta y meson y `bindgen` usan el subproyecto, como en la CI de Linux.
        MESON_PACKAGE_CACHE_DIR: /run/build/coroom/meson-packagecache
        PKG_CONFIG: /run/build/coroom/packaging/flatpak/pkg-config-sin-abseil
    build-commands:
      # Un solo comando: cada uno corre en su propio shell y los tres usan el mismo `target`.
      - |
        set -eu
        target=target
        if [ -d /run/ccache ]; then target=/run/ccache/cargo-target; fi
        cargo --offline build --release --locked -p coroom --target-dir "$target" \
          --message-format=json-render-diagnostics > cargo-messages.json
        python3 tools/prune-cargo-target.py "$target/release" cargo-messages.json
        install -Dm755 "$target/release/coroom" /app/bin/coroom
      - install -Dm644 packaging/flatpak/io.github._43fdfdg45454.coroom.desktop
        /app/share/applications/io.github._43fdfdg45454.coroom.desktop
      - install -Dm644 packaging/flatpak/io.github._43fdfdg45454.coroom.metainfo.xml
        /app/share/metainfo/io.github._43fdfdg45454.coroom.metainfo.xml
      - install -Dm644 packaging/icons/coroom.svg
        /app/share/icons/hicolor/scalable/apps/io.github._43fdfdg45454.coroom.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - third_party
          - packaging/msix
          - deploy
      - cargo-sources.json
      - type: file
        url: https://github.com/abseil/abseil-cpp/releases/download/20240722.0/abseil-cpp-20240722.0.tar.gz
        sha256: f50e5ac311a81382da7fa75b97310e4b9006474f9560ac46f54a9967f07d4ae3
        dest: meson-packagecache
      - type: file
        url: https://github.com/mesonbuild/wrapdb/releases/download/abseil-cpp_20240722.0-3/abseil-cpp_20240722.0-3_patch.zip
        sha256: 12dd8df1488a314c53e3751abd2750cf233b830651d168b6a9f15e7d0cf71f7b
        dest: meson-packagecache
