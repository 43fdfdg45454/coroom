<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono de coroom: dos anillos enlazados (anfitrión e invitado) sobre un cuadrado redondeado.
     Dibujo propio del proyecto, con su misma licencia; colores de la paleta de Adwaita. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>coroom</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c71d8"/>
      <stop offset="1" stop-color="#173f75"/>
    </linearGradient>
  </defs>
  <rect x="8" y="14" width="112" height="106" rx="26" fill="url(#borde)"/>
  <rect x="8" y="8" width="112" height="106" rx="26" fill="url(#fondo)"/>
  <circle cx="49" cy="61" r="24" fill="none" stroke="#ffffff" stroke-width="10"/>
  <circle cx="79" cy="61" r="24" fill="none" stroke="#99c1f1" stroke-width="10"/>
  <!-- El tramo del primer anillo que pasa por encima del segundo: así se ven enlazados. -->
  <path d="M 53.17 37.36 A 24 24 0 0 1 70.25 45.6" fill="none" stroke="#ffffff" stroke-width="10"/>
</svg>
